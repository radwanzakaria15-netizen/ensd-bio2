<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<style>
/* Layout: ترويسة متدرجة بشعار ENSD، ثم بطاقة زجاجية بعرض 920px تضم الفوج والمحاور والتوقيت */
:root{
  --ink:#17213b; --muted:#71809b; --primary:#5865f2; --violet:#7c3aed;
  --bg:#f3f5ff; --bg-glow-1:rgba(88,101,242,.16); --bg-glow-2:rgba(124,58,237,.13);
  --card:rgba(255,255,255,.82); --card-solid:#ffffff; --border:rgba(255,255,255,.72);
  --line:#e0e5f2; --tint:#eef2ff; --tint-2:#f2edff; --link:#4656c8; --heading:#263765;
  --shadow:0 24px 70px rgba(37,45,90,.12);
  --font:"Cairo","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8ebff; --muted:#9aa6c6; --bg:#0d1124; --bg-glow-1:rgba(88,101,242,.22); --bg-glow-2:rgba(124,58,237,.18);
    --card:rgba(26,32,64,.82); --card-solid:#1a2040; --border:rgba(255,255,255,.08);
    --line:#2c3566; --tint:#222a58; --tint-2:#2a2559; --link:#a5b0ff; --heading:#cdd5ff;
    --shadow:0 24px 70px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8ebff; --muted:#9aa6c6; --bg:#0d1124; --bg-glow-1:rgba(88,101,242,.22); --bg-glow-2:rgba(124,58,237,.18);
  --card:rgba(26,32,64,.82); --card-solid:#1a2040; --border:rgba(255,255,255,.08);
  --line:#2c3566; --tint:#222a58; --tint-2:#2a2559; --link:#a5b0ff; --heading:#cdd5ff;
  --shadow:0 24px 70px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:var(--font); color:var(--ink); line-height:1.6;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 0 0,var(--bg-glow-1),transparent 30%),
    radial-gradient(circle at 100% 15%,var(--bg-glow-2),transparent 28%);
  background-attachment:fixed;
  overflow-x:hidden;
}
.band{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}

header{
  position:relative; overflow:hidden; text-align:center; color:#fff;
  padding-block:44px 82px;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.12),transparent 28%),
    linear-gradient(135deg,#111936 0%,#3847cf 50%,#6d35d9 100%);
  box-shadow:0 18px 50px rgba(45,48,140,.2);
}
header:before,header:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045)}
header:before{width:380px;height:380px;left:-170px;top:-260px}
header:after{width:320px;height:320px;right:-150px;bottom:-240px}
header > *{position:relative}
.logo{
  width:74px;height:74px;margin:0 auto 14px;border-radius:24px;background:rgba(255,255,255,.97);color:#4f46e5;
  display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;letter-spacing:-1px;
  box-shadow:0 16px 38px rgba(0,0,0,.2);
}
.kicker{font-size:11px;font-weight:800;letter-spacing:2px;opacity:.72;margin-bottom:4px}
h1{margin:0;font-size:clamp(1.6rem,6vw,2rem);font-weight:900;text-wrap:balance}
.subtitle{margin-top:8px;font-size:14px;opacity:.86}

main{max-width:920px;margin:-46px auto 40px;position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:28px; box-shadow:var(--shadow);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); padding:28px; min-width:0;
}
.selected{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:linear-gradient(135deg,var(--tint),var(--tint-2)); border:1px solid var(--line);
  padding:17px;border-radius:18px;margin-bottom:22px;
}
.selected > div:first-child{min-width:0}
.selected strong{font-size:1.4rem;font-weight:900}
.selected small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.badge{
  flex:0 0 auto;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:9px 15px;border-radius:999px;
  font-size:.8rem;font-weight:800;box-shadow:0 7px 18px rgba(79,70,229,.22)
}
.title{text-align:center;font-size:1.4rem;font-weight:900;margin:4px 0 22px;color:var(--heading)}
.title:after{content:"";display:block;width:54px;height:4px;border-radius:99px;margin:10px auto 0;background:linear-gradient(90deg,#5865f2,#7c3aed)}
.axis{margin:0 0 22px}
.axis:last-of-type{margin-bottom:0}
.axis-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.axis-head .tag{
  font-size:11px;font-weight:900;letter-spacing:1.2px;color:#5865f2;background:var(--tint);
  padding:6px 12px;border-radius:999px;white-space:nowrap
}
.axis-head h3{margin:0;font-size:1.05rem;font-weight:800;color:var(--heading)}
.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
details{
  border:1px solid var(--line);border-radius:17px;background:var(--card-solid);
  box-shadow:0 7px 20px rgba(45,55,100,.05);transition:box-shadow .25s ease,border-color .25s ease;min-width:0
}
details:hover{box-shadow:0 13px 25px rgba(45,55,100,.1);border-color:#cbd2ff}
summary{
  list-style:none;display:flex;align-items:center;gap:13px;padding:14px;cursor:pointer;border-radius:17px
}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.num{
  flex:0 0 36px;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5865f2,#7c3aed);color:#fff;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums
}
.name{flex:1;min-width:0;font-size:.95rem;font-weight:800;line-height:1.45}
.chev{flex:0 0 auto;color:var(--muted);transition:transform .2s ease}
details[open] .chev{transform:rotate(180deg)}
.topics{margin:0;padding:2px 16px 16px 16px;list-style:none;display:flex;flex-direction:column;gap:6px}
.topics li{position:relative;padding-right:16px;font-size:.88rem;color:var(--muted)}
.topics li:before{content:"";position:absolute;right:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.box{
  text-align:center;padding:34px 18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);
  background:var(--tint)
}
.box strong{display:block;color:var(--heading);font-size:1.1rem;margin-bottom:6px}
.prog img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 10px 28px rgba(45,55,100,.15)}

.chap{
  text-decoration:none;display:flex;align-items:center;gap:13px;width:100%;padding:14px;text-align:right;font:inherit;color:inherit;
  border:1px solid var(--line);border-radius:17px;background:var(--card-solid);cursor:pointer;
  box-shadow:0 7px 20px rgba(45,55,100,.05);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,opacity .2s ease
}
.chap:hover{transform:translateY(-3px);box-shadow:0 13px 25px rgba(45,55,100,.1);border-color:#cbd2ff}
.chap:focus-visible,.back:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.chap .soon{flex:0 0 auto;font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 9px;display:none}
.chap.off{opacity:.42;cursor:default;box-shadow:none;filter:grayscale(.6)}
.chap.off:hover{transform:none;border-color:var(--line);box-shadow:none}
.chap.off .soon{display:inline-block}
.chap.off .chev{display:none}
.axis.off .axis-head{opacity:.42;filter:grayscale(.6)}
.back{
  font:inherit;font-weight:800;border:1px solid var(--line);border-radius:13px;padding:10px 15px;cursor:pointer;
  background:var(--tint);color:var(--link);margin-bottom:18px
}
.files{display:flex;flex-direction:column;gap:14px}
.files img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 10px 28px rgba(45,55,100,.15)}
.filebtn{
  display:inline-block;text-decoration:none;color:#fff;font-weight:800;padding:12px 20px;border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 7px 18px rgba(79,70,229,.22);align-self:flex-start
}
.lesson-topics{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.lesson-topics li{font-size:.85rem;background:var(--tint);color:var(--heading);padding:4px 12px;border-radius:999px}
footer{text-align:center;color:var(--muted);font-size:12px;padding-bottom:30px}
@media (max-width:650px){
  .card{padding:17px;border-radius:23px}
  .chapters{grid-template-columns:1fr}
  .selected strong{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  ["التغذية والأيض البكتيري",["الأنماط الغذائية والتنفسية","الأيض والطاقة واستقلاب الجلوكوز","التطبيقات الغذائية والدوائية والبيئية"]],
  ["النمو ومثبطات النمو",["منحنى النمو ومراحله","التعقيم والتطهير","المضادات الحيوية والمقاومة"]],
  ["تصنيف البكتيريا",["السلم والمعايير التصنيفية","التصنيف المظهري والوراثي","Proteobacteria و 16S rRNA"]],
  ["الفيروسات",["خصائص وبنية الفيروسات","اكتشافها ودورات تكاثرها","البريونات والفيروييدات"]],
  ["التطبيقات الميدانية",["التطبيقات الطبية والغذائية","التطبيقات الزراعية والبيئية","التطبيقات الصناعية والتخمر"]]]}
];


var ADMIN=false, LOGIN=false, CODE="";
try{ CODE=sessionStorage.getItem("ensd_code")||""; }catch(e){}
function $(id){ return document.getElementById(id); }
function setMsg(t){ var m=$("admMsg"); if(m) m.textContent=t; }
function api(path,method,body){
  return fetch(path,{method:method||"GET",headers:{"x-admin-code":CODE,"content-type":"application/pdf"},body:body});
}
async function load(){
  try{
    var r=await fetch("/api/lessons",{cache:"no-store"}); var ks=await r.json(); LESSONS={};
    ks.forEach(function(k){ LESSONS[k]={pdf:"/api/file?key="+k}; });
  }catch(e){}
  render();
}
function renderAdmin(){
  var h=$("adminBar"); h.innerHTML=""; h.className="";
  if(!ADMIN && !LOGIN) return;
  h.className="card adm";
  var msg=el("div",null,""); msg.id="admMsg";
  if(!ADMIN){
    h.appendChild(el("div","title","دخول الإدارة"));
    var r=el("div","row"), i=document.createElement("input"); i.type="password"; i.placeholder="أدخل الرمز"; i.autocomplete="off";
    var go=el("button","abtn pri","دخول"); go.type="button";
    var doLogin=async function(){
      CODE=i.value;
      try{
        var x=await api("/api/lessons","POST");
        if(x.ok){ ADMIN=true; LOGIN=false; try{sessionStorage.setItem("ensd_code",CODE);}catch(e){} render(); return; }
      }catch(e){}
      CODE=""; i.value=""; setMsg("الرمز غير صحيح");
    };
    go.addEventListener("click",doLogin); i.addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
    r.appendChild(i); r.appendChild(go); h.appendChild(r); h.appendChild(msg); return;
  }
  h.appendChild(el("div","title","وضع الإدارة"));
  h.appendChild(el("div",null,"ارفع ملف PDF (حتى 5 ميغابايت) لأي فصل أو احذفه. التعديل يظهر للجميع فورًا."));
  var ex=el("button","abtn","خروج"); ex.type="button"; ex.style.alignSelf="flex-start";
  ex.addEventListener("click",function(){ ADMIN=false; CODE=""; try{sessionStorage.removeItem("ensd_code");}catch(e){} render(); });
  h.appendChild(ex); h.appendChild(msg);
}
async function upload(key,f){
  if(f.size>5000000){ setMsg("الملف أكبر من 5 ميغابايت"); return; }
  setMsg("جارٍ الرفع…");
  try{
    var x=await api("/api/file?key="+key,"POST",f);
    if(!x.ok){ setMsg(x.status===401?"انتهت الجلسة، أعد الدخول":"تعذّر الرفع"); return; }
    await load(); setMsg("تم الرفع");
  }catch(e){ setMsg("تعذّر الرفع"); }
}
async function remove(key){
  try{ var x=await api("/api/file?key="+key,"DELETE"); if(x.ok){ await load(); setMsg("تم الحذف"); } else setMsg("تعذّر الحذف"); }
  catch(e){ setMsg("تعذّر الحذف"); }
}
$("admBtn").addEventListener("click",function(){ if(ADMIN) return; LOGIN=!LOGIN; renderAdmin(); window.scrollTo(0,0); });

function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function pad(n){ return (n<10?"0":"")+n; }

function render(){
  renderAdmin();
  var host=document.getElementById("axes"); host.innerHTML="";
  AXES.forEach(function(ax){
    var any=ax.chapters.some(function(c,i){ return LESSONS[ax.n+"-"+(i+1)]; });
    var box=el("div","axis"+(any?"":" off"));
    var head=el("div","axis-head"); head.appendChild(el("span","tag","المحور "+ax.n)); head.appendChild(el("h3",null,ax.title));
    box.appendChild(head);
    var grid=el("div","chapters");
    ax.chapters.forEach(function(c,i){
      var key=ax.n+"-"+(i+1), has=!!LESSONS[key];
      var direct=has && LESSONS[key].pdf && !(LESSONS[key].images||[]).length;
      var b;
      if(direct){ b=el("a","chap"); b.href=LESSONS[key].pdf; b.target="_blank"; b.rel="noopener"; }
      else { b=el("button","chap"+(has?"":" off")); b.type="button"; }
      if(!has) b.setAttribute("aria-disabled","true");
      b.appendChild(el("span","num",pad(i+1)));
      b.appendChild(el("span","name",c[0]));
      b.appendChild(el("span","soon","قريبًا"));
      b.appendChild(el("span","chev","›"));
      if(has && !direct) b.addEventListener("click",function(){ openLesson(ax,i,key); });
      if(ADMIN){
        var w=el("div","cw"); w.appendChild(b);
        var ac=el("div","acts");
        var lb=el("label","abtn",has?"استبدال PDF":"＋ رفع PDF");
        var inp=document.createElement("input"); inp.type="file"; inp.accept="application/pdf"; inp.hidden=true;
        inp.addEventListener("change",function(){ if(inp.files[0]) upload(key,inp.files[0]); });
        lb.appendChild(inp); ac.appendChild(lb);
        if(has){
          var d=el("button","abtn del","حذف"); d.type="button";
          d.addEventListener("click",function(){
            if(d.dataset.arm){ remove(key); return; }
            d.dataset.arm="1"; d.textContent="تأكيد الحذف؟"; setTimeout(function(){ d.dataset.arm=""; d.textContent="حذف"; },4000);
          });
          ac.appendChild(d);
        }
        w.appendChild(ac); grid.appendChild(w);
      } else grid.appendChild(b);
    });
    box.appendChild(grid); host.appendChild(box);
  });
}

function openLesson(ax,i,key){
  var L=LESSONS[key], c=ax.chapters[i], v=document.getElementById("lessonView");
  v.innerHTML="";
  var back=el("button","back","← العودة إلى المحاور"); back.type="button"; back.addEventListener("click",closeLesson);
  v.appendChild(back);
  v.appendChild(el("div","title","المحور "+ax.n+" · الفصل "+pad(i+1)+" · "+c[0]));
  var ul=el("ul","lesson-topics"); c[1].forEach(function(t){ ul.appendChild(el("li",null,t)); }); v.appendChild(ul);
  var files=el("div","files");
  (L.images||[]).forEach(function(src){ var im=document.createElement("img"); im.src=src; im.alt=c[0]; files.appendChild(im); });
  if(L.pdf){ var a=el("a","filebtn","فتح ملف الدرس (PDF)"); a.href=L.pdf; a.target="_blank"; a.rel="noopener"; files.appendChild(a); }
  v.appendChild(files);
  document.getElementById("homeView").style.display="none"; v.hidden=false; window.scrollTo(0,0);
}
function closeLesson(){
  document.getElementById("lessonView").hidden=true;
  document.getElementById("homeView").style.display="contents"; window.scrollTo(0,0);
}
(async function(){
  if(CODE){ try{ var x=await api("/api/lessons","POST"); ADMIN=x.ok; if(!x.ok) CODE=""; }catch(e){} }
  load();
})();
</script>
